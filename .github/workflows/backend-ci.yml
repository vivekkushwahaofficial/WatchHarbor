name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-service:
    name: Monitor Service Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: watchharbor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchharbor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/watchharbor_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TEST_DB_URL: jdbc:postgresql://localhost:5432/watchharbor_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/monitor-service/pom.xml

      - name: Run verification
        working-directory: services/monitor-service
        run: bash ./mvnw --batch-mode clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-service-test-reports
          path: services/monitor-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  monitoring-worker:
    name: Monitoring Worker Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: watchharbor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchharbor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WORKER_DB_URL: jdbc:postgresql://localhost:5432/watchharbor_test
      WORKER_DB_USERNAME: postgres
      WORKER_DB_PASSWORD: postgres
      DB_URL: jdbc:postgresql://localhost:5432/watchharbor_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TEST_DB_URL: jdbc:postgresql://localhost:5432/watchharbor_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/monitoring-worker/pom.xml

      - name: Run verification
        working-directory: services/monitoring-worker
        run: bash ./mvnw --batch-mode clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-worker-test-reports
          path: services/monitoring-worker/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
