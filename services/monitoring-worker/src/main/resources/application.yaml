spring:
  application:
    name: monitoring-worker

  datasource:
    url: ${WORKER_DB_URL:${DB_URL}}
    username: ${WORKER_DB_USERNAME:${DB_USERNAME}}
    password: ${WORKER_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    default-schema: monitoring_worker
    schemas: monitoring_worker
    create-schemas: true
    locations: classpath:db/migration

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
