spring:
  application:
    name: monitoring-worker

  datasource:
    url: ${WORKER_DB_URL:${DB_URL}}
    username: ${WORKER_DB_USERNAME:${DB_USERNAME}}
    password: ${WORKER_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    default-schema: monitoring_worker
    schemas: monitoring_worker
    create-schemas: true
    locations: classpath:db/migration

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
worker:
  monitor-service-base-url: ${MONITOR_SERVICE_BASE_URL:http://localhost:8081}
  lease-recovery-interval-ms: ${WORKER_LEASE_RECOVERY_INTERVAL_MS:10000}
  id: ${WORKER_ID:worker-local}
  lease-duration-seconds: ${WORKER_LEASE_DURATION_SECONDS:30}
  max-attempts: ${WORKER_MAX_ATTEMPTS:3}
  retry-delay-seconds: ${WORKER_RETRY_DELAY_SECONDS:5}
  polling-interval-ms: ${WORKER_POLLING_INTERVAL_MS:1000}
  reconciliation-interval-ms: ${WORKER_RECONCILIATION_INTERVAL_MS:5000}
  scheduling-page-size: ${WORKER_SCHEDULING_PAGE_SIZE:100}
