spring:
  application:
    name: monitor-service

  datasource:
    url: ${MONITOR_DB_URL:${DB_URL}}
    username: ${MONITOR_DB_USERNAME:${DB_USERNAME}}
    password: ${MONITOR_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
